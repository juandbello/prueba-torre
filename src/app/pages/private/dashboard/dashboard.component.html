<mat-drawer-container class="w-full h-full" autosize>

  <!-- CARRITO -->
  <mat-drawer #drawer position="end" mode="side" class="
      !w-[340px]
      border-l
      border-white/10
      bg-[#0B1114]
    " [mode]="drawerMode">

    <app-dashboard-summary (productoEliminado)="idPedido = $event">
    </app-dashboard-summary>

  </mat-drawer>

  <!-- CONTENIDO -->
  <mat-drawer-content class="
      h-full
      overflow-auto
      p-4
    ">

    <app-dashboard-table [productoEliminado]="idPedido" (productoEliminadoOu)="onIdCambiado($event)">
    </app-dashboard-table>

  </mat-drawer-content>

</mat-drawer-container>
